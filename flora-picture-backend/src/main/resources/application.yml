server:
  port: 8123
  servlet:
    context-path: /api
spring:
  application:
    name: flora-picture-backend
    #数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/flora_picture
    username: root
    password: 616597
mybatis-plus:
  configuration:
    #mybatis配置
    map-underscore-to-camel-case: false
    #开启日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
# 接口文档配置
knife4j:
  enable: true
  openapi:
    title: 接口文档
    version: 1.0
    group:
      default: 
        group-name: 默认分组
        api-rule: package
        api-rule-resource: 
          - com.flora.florapicturebackend.controller
        
